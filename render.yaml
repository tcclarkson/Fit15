services:
  - type: web
    name: fit15
    runtime: node
    plan: free
    # --include=dev is required: Render sets NODE_ENV=production for the build,
    # and `npm ci` would otherwise skip devDependencies (vite, typescript,
    # @types/*), which the build needs to compile the client and server.
    buildCommand: >-
      cd client && npm ci --include=dev && npm run build &&
      cd ../server && npm ci --include=dev && npm run build &&
      rm -rf public && cp -r ../client/dist public
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Data persistence: point these at a free Turso (libSQL) database so
      # accounts/streaks survive restarts and redeploys. Create a database at
      # turso.tech, then set both values in the Render dashboard (sync:false
      # keeps them out of git and prompts you to fill them in on first deploy).
      # If left blank the app still runs but falls back to an ephemeral local
      # file — data will be lost when the free service recycles.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Shared secret protecting the daily-reminder trigger endpoint. An external
      # scheduler (see .github/workflows/reminders.yml) posts to
      # /api/push/reminders/run with this value so reminders fire even while a
      # free-tier service is asleep. Copy the generated value into the matching
      # GitHub Actions secret. (Web-push VAPID keys are generated automatically
      # and stored in the database — no env setup needed.)
      - key: CRON_SECRET
        generateValue: true
    # No persistent disk: Render's free tier doesn't support them. Photo uploads
    # therefore live on ephemeral storage and are lost on restart/redeploy, but
    # the core data (accounts, streaks, friends, challenges) persists in Turso.
