services:
  - type: web
    name: fit15
    runtime: node
    plan: free
    # --include=dev is required: Render sets NODE_ENV=production for the build,
    # and `npm ci` would otherwise skip devDependencies (vite, typescript,
    # @types/*), which the build needs to compile the client and server.
    buildCommand: >-
      cd client && npm ci --include=dev && npm run build &&
      cd ../server && npm ci --include=dev && npm run build &&
      rm -rf public && cp -r ../client/dist public
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    # No persistent disk here: Render's free tier doesn't support them, and this
    # blueprint targets `plan: free`. Storage is ephemeral without one, so the
    # SQLite database and uploaded photos reset on every restart/redeploy — fine
    # for a short trial. To persist data, add a disk (mountPath e.g. /var/data)
    # and set DATA_DIR=/var/data/db + UPLOADS_DIR=/var/data/uploads, which
    # requires upgrading this service off the free plan.
