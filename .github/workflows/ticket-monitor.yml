name: Ticket price monitor

# Checks resale prices for the event in tools/ticket-monitor/config.json every
# 6 hours, commits the price history + REPORT.md, and alerts you when the
# recommendation moves to BUY or your target price is hit.
#
# Setup (Settings → Secrets and variables → Actions):
#   SEATGEEK_CLIENT_ID  free key from https://seatgeek.com/account/develop
#   NTFY_TOPIC          optional: a hard-to-guess ntfy.sh topic for phone push alerts
# Alerts also open a GitHub issue, which emails you if you watch the repo.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency: ticket-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and recommend
        id: monitor
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
        run: python tools/ticket-monitor/monitor.py run >> "$GITHUB_STEP_SUMMARY"
      - name: Commit history
        run: |
          git config user.name "ticket-monitor"
          git config user.email "ticket-monitor@users.noreply.github.com"
          git add tools/ticket-monitor/prices.csv tools/ticket-monitor/REPORT.md tools/ticket-monitor/state.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Ticket monitor: price update" && git push; }
      - name: Alert
        if: steps.monitor.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.monitor.outputs.message }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          gh issue create --title "🎟️ $MESSAGE" --body-file tools/ticket-monitor/REPORT.md
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: Harry Styles tickets" -d "$MESSAGE" "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
