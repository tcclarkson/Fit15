name: Fit 15 daily reminders

# Pings the app's reminder endpoint on a schedule so daily "log your Fit 15"
# notifications go out even when a free-tier host is asleep. The server only
# actually notifies people whose chosen time has arrived and who haven't logged
# yet, so pinging often is harmless.
#
# Setup: add two repository secrets (Settings → Secrets and variables → Actions):
#   FIT15_URL   e.g. https://fit15-xxxx.onrender.com   (no trailing slash)
#   CRON_SECRET the value generated for CRON_SECRET in the Render dashboard
#
# Caveats: GitHub's scheduled runs can be delayed 5-15+ minutes under load, and
# scheduled workflows are paused after ~60 days of no repo activity. For tighter
# timing, use an always-on host or a dedicated uptime pinger instead.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder sweep
        run: |
          if [ -z "${{ secrets.FIT15_URL }}" ]; then
            echo "FIT15_URL secret not set; skipping."; exit 0
          fi
          curl -fsS -X POST "${{ secrets.FIT15_URL }}/api/push/reminders/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -m 30 || echo "Ping failed (host may be waking up); will retry next run."
